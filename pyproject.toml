[project]
name = "nexusagent"
version = "0.6.0"
description = "Production-grade AI coding agent platform — terminal-native, privacy-first, with hybrid memory and multi-agent orchestration"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langgraph-checkpoint",
    "langgraph-checkpoint-sqlite",
    "deepagents",
    "nats-py",
    "pyyaml",
    "patch-ng",
    "fastapi",
    "uvicorn",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "basedpyright",
    "pydantic",
    "google-generativeai",
    "google-genai>=2.3.0",
    "openai",
    "gradio",
    "textual",
    "cryptography",
    "httpx",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "sqlite-vec",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "basedpyright>=1.0.0",
    "interrogate>=1.5.0",
    "pydocstyle>=6.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "pip-audit>=2.7.0",
    "gitleaks>=8.19.0",
    "cyclonedx-bom>=6.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nexus-server = "nexusagent.server:run"
nexus-client = "nexusagent.cli:main"
nexus = "nexusagent.tui:main"
nexus-web = "nexusagent.web_ui:run_ui"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in default arguments
    "SIM102", # Nested if statements
    "F821",   # Undefined name
    "RUF006", # Store asyncio task reference
    "N806",   # Uppercase local variables
    "B904",   # raise ... from inside except
    "E402",   # Module level import at top of file
    "N801",   # Class name CapWords convention
    "SIM115", # Use context manager for opening files
    "RUF012", # Mutable default value for class attribute
    "SIM117", # Nested with statements
    "N811",   # Constant imported as non-constant
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N999",   # Invalid module name
    "RUF001", # String contains ambiguous character
    "RUF003", # Comment contains ambiguous character
]

[tool.ruff.lint.isort]
known-first-party = ["nexusagent"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = true
ignore-nested-functions = true
ignore-private = true
ignore-property-decorator = true
ignore-semiprivate = true
fail-under = 80

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
match = "(?!test_).*\\.py"
match-dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"